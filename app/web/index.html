<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0f172a" />
<title>Document library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div class="shell">

  <aside class="rail">
    <header class="rail-head">
      <h1>Document library</h1>
      <p id="whoami" class="muted">Checking your access…</p>
    </header>

    <section class="rail-block">
      <div class="rail-block-head">
        <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chats</h2>
        <button id="new-chat" class="link-button" type="button">New chat</button>
      </div>
      <ul id="session-list" class="session-list"><li class="muted">Loading…</li></ul>
    </section>

    <section class="rail-block">
      <div class="rail-block-head">
        <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files</h2>
        <button id="refresh-files" class="link-button" type="button">Refresh</button>
      </div>
      <ul id="file-list" class="file-list"><li class="muted">Loading…</li></ul>
    </section>

    <section class="rail-block">
      <div class="rail-block-head">
        <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Index</h2>
        <button id="refresh-status" class="link-button" type="button">Refresh</button>
      </div>
      <dl id="index-stats" class="stats"></dl>
      <div id="index-errors" class="index-errors"></div>
      <button id="backfill" class="ghost-button" type="button">Run full backfill</button>
    </section>

    <section class="rail-block">
      <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Jobs</h2>
      <div id="job-list" class="job-list"><p class="muted">Nothing queued.</p></div>
    </section>
  </aside>

  <main class="conversation">
    <div id="transcript" class="transcript">
      <div class="opening">
        <p class="serif">Ask what the library says, or tell me what to change in it.</p>
        <p class="muted">Changes are proposed here and take effect only after you confirm them.</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <div class="composer-row">
        <div class="composer-bar">
          <label class="attach" title="Attach a PDF" aria-label="Attach a PDF">
            <input id="file-input" type="file" accept="application/pdf" hidden />
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <textarea id="message" rows="1" dir="auto" placeholder="What does the travel policy say about rail fares?" autocomplete="off"></textarea>
          <button id="send" type="submit" title="Send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
          </button>
        </div>
      </div>
      <p id="composer-note" class="muted small"></p>
    </form>
  </main>

</div>
<script src="/assets/app.js"></script>
</body>
</html>
