# Automated build and deploy for the backend (requirement 3.3).
#
# Uses OIDC federated credentials, so there is no secret in the repository - the
# same principle as the runtime. Set these repository variables/secrets once:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (federated app)
#   ACR_NAME, RESOURCE_GROUP, API_APP, WORKER_APP            (terraform outputs)
name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built in Azure, so the runner needs no Docker layer cache and the image
      # never leaves the tenant.
      - name: Build image
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "sprag:${{ github.sha }}" \
            --file app/Dockerfile app

      - name: Roll the API
        run: |
          az containerapp update \
            --name "${{ vars.API_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/sprag:${{ github.sha }}"

      - name: Roll the worker
        run: |
          az containerapp update \
            --name "${{ vars.WORKER_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/sprag:${{ github.sha }}"

      - name: Smoke test
        run: |
          URL=$(az containerapp show --name "${{ vars.API_APP }}" \
                --resource-group "${{ vars.RESOURCE_GROUP }}" \
                --query "properties.configuration.ingress.fqdn" -o tsv)
          curl -fsS "https://$URL/healthz"
